          fullDescription: newTicket.fullDescription || 'Logged via CRM Support Desk.',
          priority: newTicket.priority,
          assignedTo: newTicket.assignedTo,
          status: 'Open',
          actionsTaken: 'Ticket logged in CRM & engineer notified on WhatsApp group.',
          partRequired: newTicket.partRequired || 'None',
          timeSpent: '0 mins',
          followUpInfo: 'Await engineer acknowledgment',
          resolution: '',
          clientConfirmed: false,
          feedbackRating: null,
          feedbackComment: '',
          createdAt: now
        };

        setTickets(prev => [created, ...prev]);

        if (newTicket.waSourceId) {
          setWaLogs(prev => prev.map(w => w.id === newTicket.waSourceId ? { ...w, convertedToTicketId: tktId } : w));
        }

        fetch('api.php?action=create_ticket', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ticket: created, waSourceId: newTicket.waSourceId })
        }).catch(() => {});

        setShowCreateModal(false);
        setActiveTab('tickets');
        triggerToast(`Created & Saved Ticket ${tktId}!`);
      };

      const handleStatusChange = (ticketId, newStatus) => {
        if (newStatus === 'Closed') {
          const target = tickets.find(t => t.id === ticketId);
          if (target) {
            setClosingTicket(target);
            setCloseForm({
              actionsTaken: target.actionsTaken || 'Diagnosed and fixed reported issue.',
              resolution: target.resolution || 'Issue resolved and verified with user.',
              timeSpent: target.timeSpent !== '0 mins' ? target.timeSpent : '45 mins',
              clientConfirmed: true,
              satisfiedRating: 5,
              engineerCommunication: 'Excellent',
              knowledgeableHelpful: 'Yes',
              feedbackComment: 'Prompt support by engineer.'
            });
          }
          return;
        }
        setTickets(prev => prev.map(t => {
          if (t.id === ticketId) {
            const updated = { ...t, status: newStatus };
            fetch('api.php?action=update_ticket', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ticket: updated })
            }).catch(() => {});
            return updated;
          }
          return t;
        }));
        triggerToast(`Ticket ${ticketId} marked as ${newStatus}`);
      };

      const handleReassignEngineer = (ticketId, newEngId) => {
        const eng = engineers.find(e => e.id === newEngId);
        setTickets(prev => prev.map(t => {
          if (t.id === ticketId) {
            const updated = {
              ...t,
              assignedTo: newEngId,
              actionsTaken: `${t.actionsTaken} | Reassigned to ${eng ? eng.name : newEngId} per SOP 01.`
            };
            fetch('api.php?action=update_ticket', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ticket: updated })
            }).catch(() => {});
            return updated;
          }
          return t;
        }));
        triggerToast(`Ticket ${ticketId} reassigned to ${eng ? eng.name : newEngId}`);
      };

      const handleConfirmCloseTicket = (e) => {
        e.preventDefault();
        if (!closeForm.clientConfirmed) {
          alert('SOP Rule: Do not close a ticket without confirming the issue is resolved with the client!');
          return;
        }
        setTickets(prev => prev.map(t => {
          if (t.id === closingTicket.id) {
            const updated = {
              ...t,
              status: 'Closed',
              actionsTaken: closeForm.actionsTaken,
              resolution: closeForm.resolution,
              timeSpent: closeForm.timeSpent,
              clientConfirmed: true,
              feedbackRating: Number(closeForm.satisfiedRating),
              feedbackComment: `${closeForm.engineerCommunication} comm | Helpful: ${closeForm.knowledgeableHelpful} | ${closeForm.feedbackComment}`
            };
            fetch('api.php?action=update_ticket', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ticket: updated })
            }).catch(() => {});
            return updated;
          }
          return t;
        }));
        triggerToast(`Ticket ${closingTicket.id} Closed & Saved with ${closeForm.satisfiedRating}★ Feedback!`);
        setClosingTicket(null);
      };

      const filteredTickets = tickets.filter(t => {
        const matchStatus = ticketFilterStatus === 'All' || t.status === ticketFilterStatus;
        const matchPrio = ticketFilterPriority === 'All' || t.priority === ticketFilterPriority;
        return matchStatus && matchPrio;
      });

      const getEngineerName = (engId) => {
        const found = engineers.find(e => e.id === engId);
        return found ? `${found.name} (${found.type})` : engId;
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl border border-emerald-400 flex items-center gap-3 font-medium">
              <span>✅ {toast}</span>
            </div>
          )}

          <header className="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-lg">
                  OIT
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-white">
                    Oriflamme IT Solutions — AMC & WhatsApp Support CRM
                  </h1>
                  <p className="text-xs text-slate-400">
                    {dbStatus} • {customers.length} AMC Customers • {engineers.length} Support Engineers
                  </p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={handleExportJSON}
                  className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg transition"
                >
                  💾 Save Backup (.json)
                </button>
                <button
                  onClick={() => handleAddRandomCustomers(10)}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow transition"
                >
                  + Random Add 10 Customers
                </button>
                <button
                  onClick={() => {
                    setNewTicket({
                      customerId: customers[0].id,
                      channel: 'WhatsApp Message',
                      category: 'Hardware Issue',
                      priority: 'High',
                      issueSummary: '',
                      fullDescription: '',
                      assignedTo: customers[0].mappedEngineerId || 'ENG-01',
                      partRequired: 'None',
                      waSourceId: null
                    });
                    setShowCreateModal(true);
                  }}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow transition"
                >
                  + Create CRM Ticket
                </button>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto border-t border-slate-800/80 pt-2">
              {[
                { id: 'dashboard', label: '📊 CRM Dashboard' },
                { id: 'customers', label: `🏢 AMC Customers (${customers.length})` },
                { id: 'whatsapp', label: `💬 WhatsApp Call & Msg (${waLogs.length})` },
                { id: 'tickets', label: `🎫 Support Tickets (${tickets.length})` },
                { id: 'engineers', label: `👨‍💻 20 Engineers (${engineers.length})` },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2.5 text-xs font-semibold rounded-t-lg border-b-2 transition whitespace-nowrap ${
                    activeTab === tab.id
                      ? 'border-emerald-400 text-emerald-400 bg-slate-800/60'
                      : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/30'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-7xl mx-auto w-full px-4 py-6 flex-1 space-y-6">
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <p className="text-xs text-slate-400">Total AMC Customers</p>
                    <p className="text-2xl font-bold text-white mt-1">{customers.length}</p>
                    <p className="text-[11px] text-emerald-400 mt-1">Mapped to Dedicated Engg</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <p className="text-xs text-slate-400">Support Engineers</p>
                    <p className="text-2xl font-bold text-indigo-400 mt-1">{engineers.length}</p>
                    <p className="text-[11px] text-slate-400 mt-1">L1 Remote, L2 Field & L3 Sr.</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <p className="text-xs text-slate-400">WhatsApp Calls / Msgs</p>
                    <p className="text-2xl font-bold text-emerald-400 mt-1">{waLogs.length}</p>
                    <p className="text-[11px] text-slate-400 mt-1">Instant Ticket Conversion</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <p className="text-xs text-slate-400">Open / Active Tickets</p>
                    <p className="text-2xl font-bold text-amber-400 mt-1">
                      {tickets.filter(t => t.status !== 'Closed').length}
                    </p>
                    <p className="text-[11px] text-slate-400 mt-1">Sorted High → Med → Low</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <p className="text-xs text-slate-400">Closed Tickets</p>
                    <p className="text-2xl font-bold text-teal-400 mt-1">
                      {tickets.filter(t => t.status === 'Closed').length}
                    </p>
                    <p className="text-[11px] text-slate-400 mt-1">100% Client Confirmed</p>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h2 className="text-base font-bold text-white">Quick Simulation & CRM Operations</h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Test random AMC customer addition, incoming WhatsApp voice calls/messages, and ticket assignment.
                    </p>
                  </div>
                  <div className="flex flex-wrap gap-2.5">
                    <button
                      onClick={() => handleAddRandomCustomers(1)}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold px-3.5 py-2 rounded-lg"
                    >
                      + Add 1 Random AMC Customer
                    </button>
                    <button
                      onClick={() => handleAddRandomCustomers(10)}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg"
                    >
                      + Random Add 10 Customers
                    </button>
                    <button
                      onClick={() => {
                        const randCust = customers[Math.floor(Math.random() * customers.length)];
                        handleSimulateWhatsApp(randCust, 'WhatsApp Message');
                        setActiveTab('whatsapp');
                      }}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg"
                    >
                      💬 Simulate Random WhatsApp Msg
                    </button>
                    <button
                      onClick={() => {
                        const randCust = customers[Math.floor(Math.random() * customers.length)];
                        handleSimulateWhatsApp(randCust, 'WhatsApp Call');
                        setActiveTab('whatsapp');
                      }}
                      className="bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg"
                    >
                      📞 Simulate Random WhatsApp Call
                    </button>
                  </div>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <h3 className="text-sm font-bold text-white mb-3">
                      🚨 Oriflamme IT Solutions — Official Escalation Matrix (SOP 15)
                    </h3>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-slate-800 text-slate-400">
                            <th className="py-2">Level</th>
                            <th className="py-2">Name</th>
                            <th className="py-2">Designation</th>
                            <th className="py-2">Contact</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {ESCALATION_MATRIX.map((row) => (
                            <tr key={row.level}>
                              <td className="py-2 font-semibold text-emerald-400">{row.level}</td>
                              <td className="py-2 text-white">{row.name}</td>
                              <td className="py-2 text-slate-300">{row.role}</td>
                              <td className="py-2 text-slate-400">{row.phone}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                    <h3 className="text-sm font-bold text-white">
                      📋 Active SOP Rules Enforced in Application
                    </h3>
                    <ul className="text-xs text-slate-300 space-y-2 leading-relaxed">
                      <li>• <strong className="text-emerald-400">SOP 01 (Daily Call Assigning):</strong> Collects client issues from WhatsApp Calls, WhatsApp Messages, and Direct CRM entries; prioritizes High (VIP/Outage) → Medium → Low.</li>
                      <li>• <strong className="text-emerald-400">SOP 02 (CRM Update):</strong> Logs Ticket ID, Client Name, Contact, Priority, Assigned Engineer, Parts Required, Time Spent, and Resolution Notes.</li>
                      <li>• <strong className="text-emerald-400">SOP 10 (Data Backup 3-2-1 Rule):</strong> Tracks HDD-1 (Mon/Wed/Fri) & HDD-2 (Tue/Thu/Sat) and NAS shutdown compliance.</li>
                      <li>• <strong className="text-emerald-400">SOP 16 & 17 (Customer Mapping & Closure):</strong> Every AMC customer is mapped to one of the 20 engineers; tickets cannot be closed without Client Confirmation & 5-Star Feedback.</li>
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'customers' && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 p-4 rounded-xl">
                  <div>
                    <h2 className="text-base font-bold text-white">
                      AMC Customer Directory & Engineer Mapping ({customers.length} Customers)
                    </h2>
                    <p className="text-xs text-slate-400">
                      Trigger an instant WhatsApp Message or WhatsApp Voice Call problem directly from any customer card.
                    </p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => handleAddRandomCustomers(1)}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold px-3.5 py-2 rounded-lg"
                    >
                      + Add 1 Random Customer
                    </button>
                    <button
                      onClick={() => handleAddRandomCustomers(10)}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                    >
                      + Random Add 10 Customers
                    </button>
                  </div>
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  {customers.map((cust) => (
                    <div key={cust.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between gap-3 hover:border-slate-700 transition">
                      <div>
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <span className="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">
                              {cust.id}
                            </span>
                            <h3 className="text-sm font-bold text-white mt-1">{cust.company}</h3>
                            <p className="text-xs text-slate-400">
                              Contact: <strong className="text-slate-200">{cust.contactPerson}</strong> • {cust.phone} • {cust.location}
                            </p>
                          </div>
                          <span className={`text-[11px] font-semibold px-2.5 py-1 rounded-full ${
                            cust.tier === 'Gold VIP'
                              ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                              : cust.tier === 'Silver AMC'
                              ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40'
                              : 'bg-slate-800 text-slate-300'
                          }`}>
                            {cust.tier} ({cust.billingCycle})
                          </span>
                        </div>

                        <div className="mt-3 text-xs bg-slate-950/80 border border-slate-800/80 rounded-lg p-2.5 space-y-1">
                          <p className="text-slate-300">
                            <span className="text-slate-500">IT Setup:</span> {cust.itSetup}
                          </p>
                          <p className="text-slate-300">
                            <span className="text-slate-500">Mapped Engineer:</span>{' '}
                            <strong className="text-indigo-400">{getEngineerName(cust.mappedEngineerId)}</strong>
                            {' '}• <span className="text-slate-500">AMC Expiry:</span> {cust.amcExpiry}
                          </p>
                        </div>
                      </div>

                      <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-800/80">
                        <button
                          onClick={() => {
                            handleSimulateWhatsApp(cust, 'WhatsApp Message');
                            setActiveTab('whatsapp');
                          }}
                          className="flex-1 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-xs font-semibold py-2 px-3 rounded-lg transition"
                        >
                          💬 Send WhatsApp Message
                        </button>
                        <button
                          onClick={() => {
                            handleSimulateWhatsApp(cust, 'WhatsApp Call');
                            setActiveTab('whatsapp');
                          }}
                          className="flex-1 bg-teal-600/20 hover:bg-teal-600/30 border border-teal-500/40 text-teal-300 text-xs font-semibold py-2 px-3 rounded-lg transition"
                        >
                          📞 Make WhatsApp Call
                        </button>
                        <button
                          onClick={() => {
                            setNewTicket({
                              customerId: cust.id,
                              channel: 'WhatsApp Message',
                              category: 'Hardware Issue',
                              priority: cust.tier === 'Gold VIP' ? 'High' : 'Medium',
                              issueSummary: '',
                              fullDescription: '',
                              assignedTo: cust.mappedEngineerId,
                              partRequired: 'None',
                              waSourceId: null
                            });
                            setShowCreateModal(true);
                          }}
                          className="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition"
                        >
                          + Create Ticket
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'whatsapp' && (
              <div className="grid lg:grid-cols-3 gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 h-fit space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-sm font-bold text-emerald-400">
                      📲 Simulate Customer WhatsApp Problem
                    </h2>
                    <span className="text-[11px] bg-emerald-500/10 text-emerald-300 px-2 py-0.5 rounded">
                      SOP 01 Intake
                    </span>
                  </div>

                  <form onSubmit={handleCustomWhatsAppSubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1">Select AMC Customer</label>
                      <select
                        value={simCustomerId}
                        onChange={(e) => setSimCustomerId(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      >
                        {customers.map(c => (
                          <option key={c.id} value={c.id}>{c.id} — {c.company} ({c.tier})</option>
                        ))}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1">WhatsApp Mode</label>
                        <select
                          value={simChannel}
                          onChange={(e) => setSimChannel(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                        >
                          <option value="WhatsApp Message">💬 WhatsApp Message</option>
                          <option value="WhatsApp Call">📞 WhatsApp Voice Call</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">Priority</label>
                        <select
                          value={simPriority}
                          onChange={(e) => setSimPriority(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                        >
                          <option value="High">High (Urgent/VIP)</option>
                          <option value="Medium">Medium (SLA &lt; 4h)</option>
                          <option value="Low">Low (Next Day)</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1">Issue Category (SOP 17)</label>
                      <select
                        value={simCategory}
                        onChange={(e) => setSimCategory(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      >
                        <option value="Hardware Issue">Hardware Issue (RAM, SSD, Power, HDD)</option>
                        <option value="Software Issue">Software Issue (OS, Tally, Outlook, App)</option>
                        <option value="Network Issue">Network Issue (Firewall, Wi-Fi, LAN Drop)</option>
                        <option value="Configuration/Setup">Configuration/Setup (Printer, Email, Profile)</option>
                        <option value="AMC-Related">AMC-Related (Preventive Visit, Backup Check)</option>
                        <option value="Installation Request">Installation Request (New PC/License)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1">Problem Message / Call Transcript</label>
                      <textarea
                        rows="3"
                        value={simMessage}
                        onChange={(e) => setSimMessage(e.target.value)}
                        placeholder="Type customer problem (or leave blank to auto-fill realistic IT problem)..."
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg shadow transition"
                    >
                      Send Problem via {simChannel}
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-2 space-y-3">
                  <div className="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div>
                      <h3 className="text-sm font-bold text-white">Live Incoming WhatsApp Support Feed</h3>
                      <p className="text-xs text-slate-400">
                        Convert any customer WhatsApp message or voice call directly into an assigned CRM Ticket.
                      </p>
                    </div>
                  </div>

                  {waLogs.map((log) => (
                    <div key={log.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2.5">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                            log.channel === 'WhatsApp Call'
                              ? 'bg-teal-500/20 text-teal-300 border border-teal-500/40'
                              : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                          }`}>
                            {log.channel === 'WhatsApp Call' ? '📞 WhatsApp Call' : '💬 WhatsApp Msg'}
                          </span>
                          <span className="text-xs font-bold text-white">{log.company}</span>
                          <span className="text-xs text-slate-400">({log.contactPerson} • {log.phone})</span>
                        </div>
                        <span className="text-xs text-slate-400">{log.timestamp}</span>
                      </div>

                      <p className="text-xs text-slate-200 bg-slate-950 border border-slate-800/80 p-3 rounded-lg">
                        “{log.message}”
                      </p>

                      <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                        <div className="flex items-center gap-2 text-[11px]">
                          <span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded">
                            {log.category}
                          </span>
                          <span className={`px-2 py-0.5 rounded font-semibold ${
                            log.priority === 'High'
                              ? 'bg-rose-500/20 text-rose-300'
                              : log.priority === 'Medium'
                              ? 'bg-amber-500/20 text-amber-300'
                              : 'bg-sky-500/20 text-sky-300'
                          }`}>
                            Priority: {log.priority}
                          </span>
                        </div>

                        {log.convertedToTicketId ? (
                          <span className="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-lg border border-emerald-500/30">
                            ✓ Logged as {log.convertedToTicketId}
                          </span>
                        ) : (
                          <button
                            onClick={() => openCreateTicketFromWA(log)}
                            className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg transition"
                          >
                            + Convert to CRM Ticket
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'tickets' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
                  <div className="flex flex-wrap items-center gap-3">
                    <span className="text-xs font-semibold text-slate-400">Filter Status:</span>
                    {['All', 'Open', 'In Progress', 'Escalated', 'Closed'].map(st => (
                      <button
                        key={st}
                        onClick={() => setTicketFilterStatus(st)}
                        className={`text-xs px-3 py-1.5 rounded-lg font-semibold transition ${
                          ticketFilterStatus === st
                            ? 'bg-emerald-600 text-white'
                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                        }`}
                      >
                        {st}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center gap-3">
                    <select
                      value={ticketFilterPriority}
                      onChange={(e) => setTicketFilterPriority(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-xs rounded-lg px-3 py-1.5 text-white"
                    >
                      <option value="All">All Priorities</option>
                      <option value="High">High Priority</option>
                      <option value="Medium">Medium Priority</option>
                      <option value="Low">Low Priority</option>
                    </select>
                    <button
                      onClick={() => setShowCreateModal(true)}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                    >
                      + Create Ticket
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  {filteredTickets.map((tkt) => (
                    <div key={tkt.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                      <div className="flex flex-wrap items-start justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded">
                              {tkt.id}
                            </span>
                            <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                              tkt.priority === 'High'
                                ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40'
                                : tkt.priority === 'Medium'
                                ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                                : 'bg-sky-500/20 text-sky-300'
                            }`}>
                              {tkt.priority} Priority
                            </span>
                            <span className="text-[11px] bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded">
                              {tkt.category}
                            </span>
                            <span className="text-[11px] text-slate-400">• {tkt.channel}</span>
                          </div>
                          <h3 className="text-sm font-bold text-white mt-1.5">{tkt.issueSummary}</h3>
                          <p className="text-xs text-slate-400">
                            Client: <strong className="text-slate-200">{tkt.clientName}</strong> ({tkt.username}) • Created: {tkt.createdAt}
                          </p>
                        </div>

                        <div className="flex items-center gap-2">
                          <span className={`text-xs font-bold px-3 py-1 rounded-full ${
                            tkt.status === 'Closed'
                              ? 'bg-teal-500/20 text-teal-300 border border-teal-500/40'
                              : tkt.status === 'Escalated'
                              ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40'
                              : tkt.status === 'In Progress'
                              ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                              : 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40'
                          }`}>
                            {tkt.status}
                          </span>
                          {tkt.status !== 'Closed' && (
                            <button
                              onClick={() => handleStatusChange(tkt.id, 'Closed')}
                              className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg shadow transition"
                            >
                              ✓ Close Ticket
                            </button>
                          )}
                        </div>
                      </div>

                      <p className="text-xs text-slate-300 bg-slate-950/90 border border-slate-800 p-3 rounded-lg">
                        {tkt.fullDescription}
                      </p>

                      <div className="grid md:grid-cols-3 gap-3 text-xs bg-slate-950/50 p-3 rounded-lg border border-slate-800/60">
                        <div>
                          <span className="text-slate-500 block">Assigned Engineer (20 Roster):</span>
                          <select
                            disabled={tkt.status === 'Closed'}
                            value={tkt.assignedTo}
                            onChange={(e) => handleReassignEngineer(tkt.id, e.target.value)}
                            className="mt-1 w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white"
                          >
                            {engineers.map(eng => (
                              <option key={eng.id} value={eng.id}>
                                {eng.id} — {eng.name} ({eng.type})
                              </option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <span className="text-slate-500 block">Update CRM Status (SOP 02):</span>
                          <select
                            value={tkt.status}
                            onChange={(e) => handleStatusChange(tkt.id, e.target.value)}
                            className="mt-1 w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white"
                          >
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Escalated">Escalated to Senior L3</option>
                            <option value="Closed">Closed (Requires Confirmation)</option>
                          </select>
                        </div>

                        <div>
                          <span className="text-slate-500 block">Parts / Time Logged:</span>
                          <p className="text-slate-200 mt-1.5">
                            🔧 {tkt.partRequired} • ⏱ {tkt.timeSpent}
                          </p>
                        </div>
                      </div>

                      {tkt.status === 'Closed' && (
                        <div className="bg-teal-950/40 border border-teal-500/30 rounded-lg p-3 text-xs space-y-1">
                          <p className="text-teal-300 font-semibold">
                            ✅ Closed Resolution: <span className="font-normal text-slate-200">{tkt.resolution}</span>
                          </p>
                          <p className="text-slate-300">
                            ⭐ Client Feedback Rating: <strong className="text-amber-400">{tkt.feedbackRating} / 5 Stars</strong> — {tkt.feedbackComment}
                          </p>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'engineers' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                  <h2 className="text-base font-bold text-white">
                    20 Support Engineers Roster & Live Workload Tracker (SOP 01 & 09)
                  </h2>
                  <p className="text-xs text-slate-400">
                    Fair workload distribution across Senior L3, Network L2, Field L2, and Remote L1 support engineers.
                  </p>
                </div>

                <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {engineers.map((eng) => {
                    const activeCount = engineerWorkloads[eng.id] || 0;
                    return (
                      <div key={eng.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between gap-3">
                        <div>
                          <div className="flex items-center justify-between">
                            <span className="font-mono text-[11px] text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">
                              {eng.id}
                            </span>
                            <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${
                              activeCount === 0
                                ? 'bg-emerald-500/20 text-emerald-300'
                                : activeCount >= 2
                                ? 'bg-rose-500/20 text-rose-300'
                                : 'bg-amber-500/20 text-amber-300'
                            }`}>
                              {activeCount} Active Ticket{activeCount === 1 ? '' : 's'}
                            </span>
                          </div>
                          <h3 className="text-sm font-bold text-white mt-2">{eng.name}</h3>
                          <p className="text-xs text-emerald-400 font-medium">{eng.role}</p>
                          <p className="text-xs text-slate-400 mt-1">Specialty: {eng.specialty}</p>
                          <p className="text-[11px] text-slate-500 mt-1">📞 {eng.phone}</p>
                        </div>

                        <button
                          onClick={() => {
                            setNewTicket({
                              customerId: customers[0].id,
                              channel: 'WhatsApp Message',
                              category: 'Hardware Issue',
                              priority: 'Medium',
                              issueSummary: '',
                              fullDescription: '',
                              assignedTo: eng.id,
                              partRequired: 'None',
                              waSourceId: null
                            });
                            setShowCreateModal(true);
                          }}
                          className="w-full bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-white py-2 rounded-lg transition"
                        >
                          + Assign New Ticket
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {showCreateModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Create New CRM Support Ticket (SOP 02)</h3>
                  <button onClick={() => setShowCreateModal(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                </div>

                <form onSubmit={handleCreateTicketSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">AMC Customer</label>
                    <select
                      value={newTicket.customerId}
                      onChange={(e) => setNewTicket({ ...newTicket, customerId: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                    >
                      {customers.map(c => (
                        <option key={c.id} value={c.id}>{c.id} — {c.company} ({c.tier})</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">Source Channel</label>
                      <select
                        value={newTicket.channel}
                        onChange={(e) => setNewTicket({ ...newTicket, channel: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-white"
                      >
                        <option value="WhatsApp Message">WhatsApp Message</option>
                        <option value="WhatsApp Call">WhatsApp Call</option>
                        <option value="Phone Call">Phone Call</option>
                        <option value="CRM Portal">CRM Portal</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Category</label>
                      <select
                        value={newTicket.category}
                        onChange={(e) => setNewTicket({ ...newTicket, category: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-white"
                      >
                        <option value="Hardware Issue">Hardware Issue</option>
                        <option value="Software Issue">Software Issue</option>
                        <option value="Network Issue">Network Issue</option>
                        <option value="Configuration/Setup">Configuration</option>
                        <option value="AMC-Related">AMC-Related</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Priority</label>
                      <select
                        value={newTicket.priority}
                        onChange={(e) => setNewTicket({ ...newTicket, priority: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-white"
                      >
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Assign to Support Engineer (20 Engineers)</label>
                    <select
                      value={newTicket.assignedTo}
                      onChange={(e) => setNewTicket({ ...newTicket, assignedTo: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                    >
                      {engineers.map(eng => (
                        <option key={eng.id} value={eng.id}>
                          {eng.id} — {eng.name} ({eng.role})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Issue Summary (One-Line)</label>
                    <input
                      type="text"
                      required
                      value={newTicket.issueSummary}
                      onChange={(e) => setNewTicket({ ...newTicket, issueSummary: e.target.value })}
                      placeholder="e.g., Server not booting - SSD not detected"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Full Description & Troubleshooting Scope</label>
                    <textarea
                      rows="3"
                      required
                      value={newTicket.fullDescription}
                      onChange={(e) => setNewTicket({ ...newTicket, fullDescription: e.target.value })}
                      placeholder="Detailed explanation of the client problem..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Hardware Part Requirement (SOP 01 Sec 9)</label>
                    <input
                      type="text"
                      value={newTicket.partRequired}
                      onChange={(e) => setNewTicket({ ...newTicket, partRequired: e.target.value })}
                      placeholder="None / RAM 8GB DDR4 / SSD 512GB NVMe"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowCreateModal(false)}
                      className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold"
                    >
                      Create & Save Ticket
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {closingTicket && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="text-base font-bold text-white">
                      Close Ticket {closingTicket.id} & Record Client Feedback
                    </h3>
                    <p className="text-xs text-slate-400">{closingTicket.clientName} — {closingTicket.issueSummary}</p>
                  </div>
                  <button onClick={() => setClosingTicket(null)} className="text-slate-400 hover:text-white text-sm">✕</button>
                </div>

                <form onSubmit={handleConfirmCloseTicket} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Actions Taken by Engineer (SOP 02)</label>
                    <textarea
                      rows="2"
                      required
                      value={closeForm.actionsTaken}
                      onChange={(e) => setCloseForm({ ...closeForm, actionsTaken: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                    />
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2">
                      <label className="block text-slate-400 mb-1">Final Resolution Summary</label>
                      <input
                        type="text"
                        required
                        value={closeForm.resolution}
                        onChange={(e) => setCloseForm({ ...closeForm, resolution: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Time Spent</label>
                      <input
                        type="text"
                        required
                        value={closeForm.timeSpent}
                        onChange={(e) => setCloseForm({ ...closeForm, timeSpent: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      />
                    </div>
                  </div>

                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800 space-y-2.5">
                    <p className="font-bold text-emerald-400">📋 Client Feedback Survey (SOP 16)</p>
                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1">Satisfaction (1-5★)</label>
                        <select
                          value={closeForm.satisfiedRating}
                          onChange={(e) => setCloseForm({ ...closeForm, satisfiedRating: e.target.value })}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-white"
                        >
                          <option value="5">5 ★ - Very Satisfied</option>
                          <option value="4">4 ★ - Satisfied</option>
                          <option value="3">3 ★ - Neutral</option>
                          <option value="2">2 ★ - Unsatisfied</option>
                          <option value="1">1 ★ - Very Unsatisfied</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">Professionalism</label>
                        <select
                          value={closeForm.engineerCommunication}
                          onChange={(e) => setCloseForm({ ...closeForm, engineerCommunication: e.target.value })}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-white"
                        >
                          <option value="Excellent">Excellent</option>
                          <option value="Good">Good</option>
                          <option value="Fair">Fair</option>
                          <option value="Poor">Poor</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">Helpful?</label>
                        <select
                          value={closeForm.knowledgeableHelpful}
                          onChange={(e) => setCloseForm({ ...closeForm, knowledgeableHelpful: e.target.value })}
                          className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-white"
                        >
                          <option value="Yes">Yes</option>
                          <option value="No">No</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1">Customer Comments</label>
                      <input
                        type="text"
                        value={closeForm.feedbackComment}
                        onChange={(e) => setCloseForm({ ...closeForm, feedbackComment: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white"
                      />
                    </div>
                  </div>

                  <label className="flex items-center gap-2.5 p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={closeForm.clientConfirmed}
                      onChange={(e) => setCloseForm({ ...closeForm, clientConfirmed: e.target.checked })}
                      className="rounded"
                    />
                    <span className="font-semibold">
                      Mandatory SOP 01 Check: Client has confirmed the issue is resolved to their satisfaction.
                    </span>
                  </label>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setClosingTicket(null)}
                      className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white font-semibold"
                    >
                      Confirm & Close Ticket
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
